services:
  - type: web
    name: vsutra-api-prod
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: TRUSTED_HOSTS
        value: vsutra-api-prod.onrender.com
      - key: AUTH_DATABASE_URL
        sync: false
      - key: SANDBOX_ENABLED
        value: "false"
      - key: FRONTEND_ORIGINS
        sync: false
      - key: APP_WEB_URL
        sync: false
