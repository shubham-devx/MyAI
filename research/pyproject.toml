[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vsutra-research"
version = "0.1.0"
description = "Offline evaluation, dataset validation, hardware planning, and model registry for V-Sutra"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["vsutra_research*"]
